<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Your cart')}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>

<main class="container py-4">
    <h1 class="page-title">Your cart</h1>

    <div class="panel text-center py-5" th:if="${#lists.isEmpty(items)}">
        <i class="bi bi-bag fs-1 text-muted"></i>
        <h2 class="h4 mt-2">Your cart is empty</h2>
        <p class="text-muted">Find something handmade and it will show up here.</p>
        <a class="btn btn-indigo" th:href="@{/products}">Browse the collection</a>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(items)}">
        <div class="col-lg-8">
            <div class="panel p-0">
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                        <tr><th>Product</th><th>Price</th><th>Quantity</th><th class="text-end">Subtotal</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="i : ${items}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img class="thumb" th:src="@{${i.product.imageUrl}}" alt="">
                                    <div>
                                        <a th:href="@{/products/{id}(id=${i.product.id})}" th:text="${i.product.name}">Product</a>
                                        <div class="small text-muted">by <span th:text="${i.product.artisan.name}">Artisan</span></div>
                                        <div class="stock-low" th:if="${i.quantity gt i.product.stock}"
                                             th:text="'Only ' + ${i.product.stock} + ' left in stock'">Only 1 left</div>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${@fmt.money(i.product.price)}">Rs 0.00</td>
                            <td>
                                <form th:action="@{/cart/update/{id}(id=${i.id})}" method="post" class="d-flex">
                                    <label class="visually-hidden" th:for="'qty' + ${i.id}">Quantity</label>
                                    <input th:id="'qty' + ${i.id}" type="number" name="quantity" min="1" th:max="${i.product.stock}"
                                           th:value="${i.quantity}" class="form-control form-control-sm qty">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary ms-1" title="Update quantity">
                                        <i class="bi bi-arrow-repeat"></i>
                                    </button>
                                </form>
                            </td>
                            <td class="text-end fw-semibold" th:text="${@fmt.money(i.subtotal)}">Rs 0.00</td>
                            <td class="text-end">
                                <form th:action="@{/cart/remove/{id}(id=${i.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Remove"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="summary-card">
                <h2 class="h5 mb-3">Order summary</h2>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Items</span><span th:text="${#lists.size(items)}">1</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Shipping</span><span>Free</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
                    <span>Total</span><span th:text="${@fmt.money(total)}">Rs 0.00</span>
                </div>
                <a class="btn btn-madder w-100" th:href="@{/checkout}">Continue to checkout</a>
                <a class="btn btn-link w-100 mt-1" th:href="@{/products}">Keep shopping</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
