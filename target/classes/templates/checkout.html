<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Checkout')}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>

<main class="container py-4">
    <h1 class="page-title">Checkout</h1>

    <div class="row g-4">
        <div class="col-lg-7">
            <form th:action="@{/checkout}" method="post" class="panel">
                <h2 class="h5 mb-3">Delivery details</h2>
                <div class="mb-3">
                    <label class="form-label" for="address">Shipping address</label>
                    <textarea class="form-control" id="address" name="address" rows="3" required maxlength="500"
                              placeholder="House no, street, town, state, PIN code" th:text="${user.address}"></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="phone">Phone number</label>
                    <input class="form-control" type="tel" id="phone" name="phone" th:value="${user.phone}"
                           pattern="[0-9+\-\s]{7,15}" title="Enter a valid phone number">
                </div>

                <h2 class="h5 mb-3">Payment method</h2>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="payCod" value="COD" checked>
                    <label class="form-check-label" for="payCod">Cash on delivery</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="payUpi" value="UPI">
                    <label class="form-check-label" for="payUpi">UPI (demo)</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="paymentMethod" id="payCard" value="CARD">
                    <label class="form-check-label" for="payCard">Credit or debit card (demo)</label>
                </div>
                <p class="small text-muted">Online payment is simulated for this project. No money is charged and no card details are collected.</p>

                <button type="submit" class="btn btn-madder btn-lg w-100">Place order</button>
            </form>
        </div>

        <div class="col-lg-5">
            <div class="summary-card">
                <h2 class="h5 mb-3">Your items</h2>
                <div class="d-flex align-items-center gap-3 mb-3" th:each="i : ${items}">
                    <img class="thumb" th:src="@{${i.product.imageUrl}}" alt="">
                    <div class="flex-grow-1">
                        <div class="small fw-semibold" th:text="${i.product.name}">Product</div>
                        <div class="small text-muted" th:text="${i.quantity} + ' x ' + ${@fmt.money(i.product.price)}">1 x Rs 0</div>
                    </div>
                    <div class="fw-semibold" th:text="${@fmt.money(i.subtotal)}">Rs 0.00</div>
                </div>
                <hr>
                <div class="d-flex justify-content-between fs-5 fw-bold">
                    <span>Total</span><span th:text="${@fmt.money(total)}">Rs 0.00</span>
                </div>
                <a class="btn btn-link px-0 mt-2" th:href="@{/cart}">Edit cart</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
